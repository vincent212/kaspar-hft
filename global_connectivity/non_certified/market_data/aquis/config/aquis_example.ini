# Example settings for one Aquis feed (not certified; see ../README.md).
# Not read by any code yet: AquisFeed::Config is filled by the caller.
# Values below are the defaults of HandlerConfig and AquisFeed::Config.

[aquis_uk_split1]
venue = AQXE                         ; en::x code: AQXE (Aquis UK) or AQEU (Aquis EU)
operating_mic = AQXE                 ; rows of the security file to load
security_file = /data/aquis/SecurityList.csv
universe_file = /etc/kaspar/aquis_universe.csv   ; umtf,sec_id
start_of_day = true                  ; false: start from the next snapshot
use_replay = true
max_replay = 50000                   ; larger gaps go to the snapshot
bundles_sequenced = true             ; review.md decision 2
