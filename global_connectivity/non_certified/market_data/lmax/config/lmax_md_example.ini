; LMAX Broker Market Data (FIX 4.4) for LmaxMdFeed and lmax_md_check.
; Not certified. Demo environment only: the handler refuses any host that is
; not *.london-demo.lmax.com when environment = demo, and refuses production.
environment = demo
host = fix-marketdata.london-demo.lmax.com
port = 443
tls = true
; Credentials and CompIDs: outside the repository (README, Live check).
key_file = /Users/you/.kaspar/keys/lmax_demo.json
dictionary = /path/to/global_connectivity/non_certified/market_data/lmax/dict/LMAX-FIX44-MarketData.xml
instruments = /path/to/global_connectivity/non_certified/market_data/lmax/config/instruments_demo.csv
; FIX log with the password redacted; empty for none.
log_path = /tmp/lmax_md_log
depth = 20
trades = true
heartbeat_s = 30
reconnect_s = 5
gap_timeout_ms = 2000
stall_ms = 30000
; en::x name for the records; LMAX has no code yet (README, Venue code).
venue = UNI
