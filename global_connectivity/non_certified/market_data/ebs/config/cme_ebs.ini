; EBS Market on CME Globex -- PROPOSED channel entries for kaspr/config/cme.ini.
; NOT USED: kaspr cannot consume EBS today (template 63/64/65/66/69 have no
; dispatch; see ../feed.md section 7 and ../patch_proposal.md). Nothing here was
; run. Keys are the ones kaspr.cpp reads for a channel (kaspr/src/kaspr.cpp,
; start-channel block: chan, cme_ini, cme_do_recovery, cme_disable_mbo,
; cme_max_mbp_level, cme_cpus).
; cme_ini is opened as given, relative to the working directory (kaspr runs
; from kaspr/, where the CME entries use "genconfig/mdp3_prod.info";
; kaspr/src/kaspr.cpp, read_info(cme_inifile)), hence the leading "../".
;
; Channel choice (../review.md decision 5): the 1 ms conflated UDP channels,
; 518 (New York: G10 + metals) and 519 (London: EM FX). 528/529 carry the same
; product lists at a coarser conflation interval; 520/530 are OFF SEF NDFs.
; Channel facts: CME SFTP SBEFix/Production/Configuration/Ultra*/EBS*Config.xml,
; copied into ebs_mdp3_prod.info.

cme {
    ; EBS Live Ultra - G10 + Metals - Conflated 1ms (NY5)
    ebs_ny_ultra_1ms {
        cme_ini "../global_connectivity/non_certified/market_data/ebs/config/ebs_mdp3_prod.info"
        chan 518
        ; EBS sends no MBO: NoOrderIDEntries is always 0 (wiki 457423069).
        cme_disable_mbo true
        ; MarketDepth (tag 264) comes per instrument in the FX definition;
        ; 10 is the value CME FX Spot+ instruments carry (secdef.dat, 1022=GBX 264=10)
        ; and the EBS DataMine L2 history depth (wiki 457573144: "five or ten").
        cme_max_mbp_level 10
        ; RecoveryProcessor decodes only template 53 (MBO); the EBS snapshot is
        ; template 69. With recovery on, the snapshot loop would never yield a
        ; book. Off until the patch adds 69 (review.md decision 3).
        cme_do_recovery false
    }

    ; EBS Live Ultra - EM FX - Conflated 1ms (LD4)
    ebs_ln_ultra_1ms {
        cme_ini "../global_connectivity/non_certified/market_data/ebs/config/ebs_mdp3_prod.info"
        chan 519
        cme_disable_mbo true
        cme_max_mbp_level 10
        cme_do_recovery false
    }
}
