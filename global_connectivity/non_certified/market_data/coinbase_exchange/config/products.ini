; Coinbase Exchange products for the market-data handler and cbx_md.
;
;   quote_increment, base_increment   as GET /products/<id> gives them (checked
;                                     against the venue at start)
;   qty_unit     the unit of displayQty sent to OB, in the base currency. Sizes
;                are kept exactly in the sync; OB gets ceil(size / qty_unit),
;                at most 9,999,999 (OB refuses CHOPIN_MAX_ORD_SZ = 10,000,000
;                units or more; feed.md section 8)
;   sec_id       securityID in the records (the Kaspar asset's exchange id)
;   chunk        Mbp2Mbo's synthetic order size for the public L2 fallback (as
;                sim/config_binance/coinbase.ini)
;
; Unit choice, measured on the REST level-3 books of 2026-11-18 17:27 UTC:
;   BTC-USD  101,723 orders, 1e-8 to 3359.2 BTC; the largest within 5% of the
;            touch 56.5 BTC. 1e-5 BTC holds up to 99.99999 BTC; 3,374 orders
;            (3.3%) are below 1e-5 and show as 1 unit; the few above 100 BTC
;            (at prices like 0.01 or 89,000) saturate.
;   ETH-USD  50,779 orders, 1e-8 to 1467.7 ETH; largest within 5% 743.8 ETH.
;            1e-4 ETH holds up to 999.9999 ETH; 917 orders (1.8%) are below
;            1e-4 and show as 1 unit.

[BTC-USD]
quote_increment = 0.01
base_increment = 0.00000001
qty_unit = 0.00001
sec_id = 1
chunk = 0.01

[ETH-USD]
quote_increment = 0.01
base_increment = 0.00000001
qty_unit = 0.0001
sec_id = 2
chunk = 0.1
