; Japannext PTS equities market data: one section per MoldUDP64 stream.
; Multicast groups, ports and server addresses are not in the public documents;
; the values below are the public sample capture's (feed.md section 2) and are
; placeholders for a real connection. Not certified: see README.md.
;
; stream: 0..63, the top 6 bits of every orderID
; join: snapshot | one | first (Handler::Join)
; rerequest_host: MoldUDP64 re-request server, IPv4; empty = none (gaps go to GLIMPSE)
; glimpse_retry_s: wait after a failed GLIMPSE session, doubling each time up to glimpse_retry_max_s
; credentials: a file outside the repository, username on the first line, password on the second
; session_date: yyyymmdd; empty = from the clock (the JST date six hours back)
[jnx.0]
name = JNX
stream = 0
group = 232.66.1.2
port = 11002
interface = 0.0.0.0
join = snapshot
rerequest_host =
rerequest_port = 0
rerequest_timeout_s = 2
glimpse_host =
glimpse_port = 15002
glimpse_retry_s = 1
glimpse_retry_max_s = 30
credentials =
session_date =
asset_prefix = JNX:
fast_send = true
