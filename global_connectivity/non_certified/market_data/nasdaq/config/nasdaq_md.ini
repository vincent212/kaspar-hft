; Nasdaq TotalView-ITCH 5.0 handler (not certified): one section per market.
; Read with nasdaq_md::config_from_ini(pt.get_child("NASDAQ")).
; Addresses below are placeholders: Nasdaq publishes the real ones at
; http://www.nasdaqtrader.com/Trader.aspx?id=FeedIPS (not read; feed.md section 1).

NASDAQ
{
  market NASDAQ                 ; NASDAQ | NASDAQBX | NASDAQPSX (en::x code, Operational Halt market Q/B/X)
  date 20260612                 ; trading date, YYYYMMDD: timestamps are ns since midnight ET
  symbols AAPL,MSFT             ; routed symbols; empty = every live symbol
  include_test_issues false
  asset_prefix ""               ; Kaspar asset name = prefix + symbol
  ; multicast feeds A and B (mcast_recv SocketReader<uint64_t,10>)
  group_a 0.0.0.0
  port_a 0
  group_b 0.0.0.0
  port_b 0
  interface 0.0.0.0
  ; MoldUDP64 re-request server
  rerequest_host ""
  rerequest_port 0
  rerequest_retry_ms 50
  rerequest_max_tries 5
  max_hole 100000               ; larger holes go straight to GLIMPSE
  ; GLIMPSE (SoupBinTCP)
  glimpse_host ""
  glimpse_port 0
  glimpse_user ""
  glimpse_password ""
  snapshot_on_late_join true    ; first packet of a session above 1: take a GLIMPSE spin
  fast_send true
}
