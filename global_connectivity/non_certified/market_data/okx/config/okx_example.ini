# OKX V5 public market data (not certified): one section per instrument, read
# by OkxFeed::config_from_ini. No account or key is needed.
#
# host:         ws.okx.com (production public data; the demo host
#               wspap.okx.com serves the demo books, which differ)
# window_depth: best levels per side sent to OB through Mbp2Mbo (OKX sends 400)
# tick:         tickSz from GET /api/v5/public/instruments
# chunk:        quantity per synthetic order, in OKX's sz unit (BTC for spot,
#               contracts of 0.01 BTC for BTC-USDT-SWAP)
# sec_id:       the Kaspar asset's securityID (OB drops records for others)

[instrument.btc_usdt]
inst_id = BTC-USDT
inst_type = SPOT
host = ws.okx.com
window_depth = 50
tick = 0.1
chunk = 0.01
sec_id = 1

[instrument.btc_usdt_swap]
inst_id = BTC-USDT-SWAP
inst_type = SWAP
host = ws.okx.com
window_depth = 50
tick = 0.1
chunk = 1
sec_id = 2
