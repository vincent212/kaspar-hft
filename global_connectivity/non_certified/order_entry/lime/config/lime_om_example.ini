# LimeOM example configuration. Not certified; never connected to Lime.
# Credentials are NOT here: `credentials` names a file outside the repository
# with `user`, `password` (and optionally `account`).

venue = LIME
sim = true                      # SimLime in-process; false: the Lime SDK (build with LIME_SDK_HEADER)

# Session (TradingApi constructor, Lime C++ Trading API Overview v1.78.0 section 3)
account = YOUR_ACCOUNT
host =                          # empty: the Lime trading platform on this host
infiniband = false
cancel_all_on_disconnect = true
first_event_id = 0              # first login of the process: 0 = no replay, 1 = replay the day
reconnect_ms = 2000
credentials = /etc/kaspar/secrets/lime_credentials.ini

# Orders
default_route = INET            # ExDestination, Lime FIX Manual appendix C
algo_route = LSS                # route for orders with a strategy (see feed.md section 10)
algo_strategies = VWAP, TWAP, IS, CLOSE
allow_market = false
allow_short = true
sale_affirm = false             # DVP accounts only
regular_session_only = false

# Local risk limits (0 = none)
max_order_qty = 10000
max_order_notional = 1000000
max_orders_per_sec = 50

# Simulator
sim_ack_delay_ms = 0
sim_fill_delay_ms = 50
sim_fill_parts = 1
sim_fill = true
