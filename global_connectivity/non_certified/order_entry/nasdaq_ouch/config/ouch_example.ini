# OuchOM settings (OuchOMConfig::from_file). Example only: no address,
# port or credential here is real.
#
# Credentials are not in this file: `credentials` names a deployment file
# outside the repository holding
#   username = <6 characters at most>
#   password = <10 characters at most>

# Run against SimOuch, the in-process simulator, instead of Nasdaq.
sim = true
sim_fill_delay_ms = 50
sim_fill_parts = 1
sim_fill = true

# SoupBinTCP session (ignored when sim = true).
host = 192.0.2.1
port = 0
credentials = /etc/kaspar/ouch_credentials.ini
heartbeat_ms = 1000
receive_timeout_ms = 15000
connect_timeout_ms = 5000
reconnect_ms = 2000
# SoupBinTCP sequence number asked for on the first login of the process:
# 0 = from the most recent message (no replay), 1 = the whole day.
first_sequence = 0

# Order defaults (OUCH 5.0 2.1).
firm =
capacity = A
display = Y
intermarket_sweep = N

# Local limits, checked before an order is sent; 0 = none.
max_order_qty = 1000
max_order_notional = 100000
max_orders_per_sec = 50
