# ClearStreetOM example configuration (not certified; never connected).
# Credentials are not here: key_file names a file outside the repository.

venue = CLEARSTREET
# sim: in-process SimClearStreet. uat / production: QuickFIX to Clear Street.
# Clear Street's guide names no UAT environment; production needs production_ok.
environment = sim
production_ok = no

# Tag 1 on every order; must be one of the accounts Clear Street lists in its Logon.
account = SIM1
# asset_id,symbol,tick
instruments = config/instruments_example.csv
# optional ClOrdID prefix (letters and digits): <prefix><YYYYMMDD>-<client id>
clordid_prefix = K

# SOM short sale -> 54=2 with 77=O. no: refuse SOM short sales locally.
mark_short_open = yes

# Local limits (0: none)
max_order_qty = 10000
max_notional = 1000000
max_orders_per_sec = 50

# --- FIX session (environment uat or production) ---
# Provided by Clear Street when the session is provisioned (guide, FAQ).
host =
port =
# yes: QuickFIX SSLSocketInitiator; no: plain TCP (TLS or a private line outside FIX)
tls = no
sender_comp_id =
target_comp_id =
heartbeat = 30
# make dict
dictionary = build/ClearStreet-FIX42.xml
# keep between runs: QuickFIX sequence numbers (Clear Street does not reset them on reconnect)
store_path = /var/lib/kaspar/clearstreet/store
log_path = /var/log/kaspar/clearstreet
# the API key generated in Clear Street's web application (Logon 554)
key_file = /etc/kaspar/keys/clearstreet_api_key
# Session window in UTC: the guide says Sunday 8 pm to Friday 8 pm "EST".
start_day = Monday
start_time = 01:00:00
end_day = Saturday
end_time = 00:00:00
# any other QuickFIX session setting: qf.<Key> = value
# qf.SSLProtocol = +TLSv1.2 +TLSv1.3
