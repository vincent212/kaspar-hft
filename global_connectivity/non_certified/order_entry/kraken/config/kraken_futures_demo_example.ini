# Kraken order entry: the Kraken Futures demo environment (README.md).
# Not certified. Keys are not in this file: key_file names a JSON file
# outside the repository, {"api_key": "...", "api_secret": "..."}.
# (Boost's ini reader has no end-of-line comments: comments go on their own line.)

[kraken]
# spot | futures
product = futures
# true: only demo-futures.kraken.com is accepted
testnet = true
rest_host = demo-futures.kraken.com
key_file = ~/.kaspar/keys/kraken_futures_demo.json
# GET /fills and POST /orders/status period
poll_ms = 1000
# cancelallordersafter timeout; 0 = off
cancel_after_s = 60
# true: SimKraken, no network, no keys
sim = false

# Kaspar asset name:venue symbol, comma separated
symbols = KRAKENF_PFXBTUSD:PF_XBTUSD
# one SOM size unit, in BTC (the PF_XBTUSD minimum size)
qty_unit = 0.0001
clid_prefix =
day_as_gtc = true
post_only = false
reconnect_ms = 2000

# local risk limits (0 = none): 0.001 BTC, 200 USD, 2 orders/s
max_order_units = 10
max_order_notional = 200
max_orders_per_sec = 2
