; CbxOM configuration (example). Credentials are not here: they are read at
; run time from session.key_file, a JSON file outside the repository
; (README.md, "Credentials").

[session]
; sandbox or production. A sandbox configuration refuses any host that is
; not *.sandbox.exchange.coinbase.com, and refuses credentials whose
; "environment" is not "sandbox".
environment = sandbox
; empty: fix-ord.sandbox.exchange.coinbase.com:6121 (from the environment)
host =
port = 0
key_file = ~/.kaspar/keys/coinbase_exchange_sandbox.json
; CancelOrdersOnDisconnect (8013): Y = the profile's orders (Coinbase's
; recommendation), S = this session's, none = off
cancel_on_disconnect = Y
; HeartBtInt, at most 30
heartbeat_s = 10
; QuickFIX FileStorePath and FileLogPath; keep it between runs
store_dir = /var/tmp/kaspar_cbx_om
; TLS: the CA bundle, or the sandbox certificate from
; exchange/introduction/sandbox. Empty: the system's default paths.
ca_file =
transport_dict = ~/kaspar-hft/global_connectivity/non_certified/order_entry/coinbase_exchange/fix/FIXT11-prod-sand.xml
app_dict = ~/kaspar-hft/global_connectivity/non_certified/order_entry/coinbase_exchange/fix/FIX50-prod-sand.xml
; QuickFIX's own retry interval (ReconnectInterval) while a connection does
; not come up, inside one session object
reconnect_s = 5

[orders]
products = BTC-USD,ETH-USD
; what SOM DAY becomes (Coinbase has no DAY): gtc, gtd (until the next
; 00:00 UTC) or reject
day_tif = gtc
; ExecInst 18=A on every limit order
post_only = false
; SelfTradeType 7928: D decrement and cancel, O cancel oldest, N cancel
; newest, B cancel both
self_trade = D
; local limits; 0 = none. Quantities in SOM units (qty_unit below).
max_order_qty = 0
max_order_notional = 0
; Coinbase allows 100 requests a second per session and disconnects above 200
max_orders_per_sec = 50
; after a disconnect, a new session after this long
reconnect_ms = 2000
; no Logon answer within this long of connecting (the TCP or TLS connection
; never came up): the session is dropped and a new one made after reconnect_ms
logon_timeout_ms = 15000
; true: SimCbx instead of the FIX session
sim = false

[sim]
fill = true
fill_delay_ms = 50
fill_parts = 1

; One section per product in orders.products, from GET /products/<id>.
; qty_unit: one SOM size unit, a multiple of base_increment; empty or absent:
; base_increment.
[BTC-USD]
quote_increment = 0.01
base_increment = 0.00000001

[ETH-USD]
quote_increment = 0.01
base_increment = 0.00000001
