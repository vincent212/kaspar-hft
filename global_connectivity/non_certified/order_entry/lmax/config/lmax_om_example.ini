; LMAX Broker Trading (FIX 4.4) for LmaxOM and lmax_om_check.
; Not certified. Demo environment only: the OM refuses any host that is not
; *.london-demo.lmax.com when environment = demo, and refuses production.
venue = UNI
environment = demo
host = fix-order.london-demo.lmax.com
port = 443
tls = true
key_file = /Users/you/.kaspar/keys/lmax_demo.json
dictionary = /path/to/global_connectivity/non_certified/order_entry/lmax/dict/LMAX-FIX44-Trading.xml
instruments = /path/to/global_connectivity/non_certified/market_data/lmax/config/instruments_demo.csv
; Sequence numbers persist for the week (review.md decision 1); keep this directory.
store_path = /var/lib/kaspar/lmax_store
reset_on_logon = false
log_path = /tmp/lmax_om_log
reinstate_on_disconnect = false
status_on_logon = true
max_order_qty = 10
max_orders_per_sec = 5
