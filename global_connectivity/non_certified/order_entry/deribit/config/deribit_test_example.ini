# Deribit order manager and fills client, test environment (not certified).
#
# environment = test: the host must be test.deribit.com; www.deribit.com is
# refused. environment = production is refused unless allow_production = true.
#
# key_file: JSON {"client_id": "...", "client_secret": "..."} of an API key
# created on test.deribit.com (scope trade:read_write). Outside the
# repository; never committed.

[deribit]
environment = test
host = test.deribit.com
key_file = ~/.kaspar/keys/deribit_test.json
reconnect_ms = 2000
heartbeat_s = 30
cancel_on_disconnect = true
post_only = false
max_orders_per_sec = 5
max_order_units = 10
max_order_notional = 100

# One section per instrument. BTC-PERPETUAL (public/get_instrument on
# 2026-11-18): tick_size 0.5, contract_size 10, min_trade_amount 10, amount in
# USD. One SOM unit = one contract = 10 USD.
[instrument.btc_perpetual]
asset = BTC-PERPETUAL_DERIBIT
instrument = BTC-PERPETUAL
currency = BTC
tick = 0.5
qty_unit = 10
inverse = true

[post_trade]
reconcile_every_s = 60
reconcile_lookback_s = 3600
