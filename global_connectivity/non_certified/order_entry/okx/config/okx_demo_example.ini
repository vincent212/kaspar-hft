# OKX order manager and post-trade client, demo trading (not certified).
#
# environment = demo: the WebSocket host must be wspap.okx.com, and every
# request carries x-simulated-trading: 1 (docs-v5, Demo Trading Services).
# environment = production is refused unless allow_production = true.
#
# key_file: JSON {"api_key": "...", "secret_key": "...", "passphrase": "..."}
# of an OKX demo-trading API key. Outside the repository; never committed.

[okx]
environment = demo
ws_host = wspap.okx.com
rest_host = openapi.okx.com
key_file = ~/.kaspar/keys/okx_demo.json
reconnect_ms = 2000
post_only = false
max_orders_per_sec = 10
max_order_units = 100
max_order_notional = 1000
cancel_all_after_s = 0

# One section per instrument. inst_id_code and tick from GET
# /api/v5/public/instruments sent WITH x-simulated-trading: 1: demo and
# production differ (2026-11-18: BTC-USDT-SWAP is instIdCode 2021032601102993,
# tickSz 0.01 in demo; 10459, tickSz 0.1 in production; BTC-USDT is 3, tickSz
# 0.1 in both). Re-read them before a demo run. qty_unit is the size of one
# SOM unit in OKX's sz unit: BTC for spot, contracts (0.01 BTC each) for the
# swap; it must be a multiple of the instrument's lotSz (1e-8 BTC, 0.01).
[instrument.btc_usdt]
asset = BTC-USDT_OKX
inst_id = BTC-USDT
inst_id_code = 3
inst_type = SPOT
td_mode = cash
tick = 0.1
qty_unit = 0.0001

[instrument.btc_usdt_swap]
asset = BTC-USDT-SWAP_OKX
inst_id = BTC-USDT-SWAP
inst_id_code = 2021032601102993
inst_type = SWAP
td_mode = cross
tick = 0.01
qty_unit = 0.01
