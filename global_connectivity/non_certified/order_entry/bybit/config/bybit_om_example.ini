; BybitOM settings (example). NOT CERTIFIED. Testnet only: with testnet = true
; the OM refuses any host that is not a Bybit testnet or demo host.
[om]
sim = false
testnet = true
; testnet: api-testnet.bybit.com / stream-testnet.bybit.com
; demo:    api-demo.bybit.com    / stream-demo.bybit.com
rest_host = api-testnet.bybit.com
ws_host = stream-testnet.bybit.com
; {"api_key": "...", "api_secret": "..."}, outside the repository
key_file = ~/.kaspar/keys/bybit_testnet.json
recv_window_ms = 5000
reconnect_ms = 2000
; Bybit has no day orders: DAY is sent as GTC when true, refused when false
day_as_gtc = true
; local limits (0: none); SOM size units and quote currency
max_order_qty = 1000
max_order_notional = 20000
max_orders_per_sec = 10
; --sim runs (SimBybit)
sim_fill_delay_ms = 50
sim_fill_parts = 2
sim_fill = true

[instruments]
; SOM sym = <category> <symbol> <tick> <qty_unit>
1 = linear BTCUSDT 0.1 0.001
2 = spot BTCUSDT 0.1 0.000001
