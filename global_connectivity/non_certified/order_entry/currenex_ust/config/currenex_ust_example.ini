# CurrenexOM settings (CurrenexOMConfig::from_file). Example only: no
# address, port or credential here is real.
#
# Credentials are not in this file: `credentials` names a deployment file
# outside the repository holding
#   user = <20 characters at most>
#   password = <20 characters at most>

# The en::x code the OM registers with the SOM for. kaspar has no Currenex
# code yet; SIM is used here for simulator runs only.
venue = SIM

# Run against SimCurrenex, the in-process simulator, instead of Currenex.
sim = true
sim_fill_delay_ms = 50
sim_fill_parts = 1
sim_fill = true
sim_pending_fill = false

# TCP session (ignored when sim = true).
host = 192.0.2.1
port = 0
credentials = /etc/kaspar/currenex_ust_credentials.ini
receive_timeout_ms = 10000
connect_timeout_ms = 5000
logon_timeout_ms = 10000
reconnect_ms = 2000
# Logon Version: 200 (Ouch 2.0 US Treasury).
version = 200

# Persistence (UST OUCH 5.5): set to true only when Currenex has configured
# it for this user; the OM then asks for a replay of what it missed.
persistence = false
# Currenex cancels active orders on logout and disconnect (8.7) unless asked
# not to; match what Currenex has configured.
cancel_on_disconnect = true
# First logon of the process: ask for a replay from this sequence number
# (0: none).
first_resend_from = 0

# On-behalf-of trading (UST OUCH 7.1): -1 when not routing for another
# entity; or name the routed user and the OM looks up its key.
routed_user_key = -1
routed_user_id =

# Dollars of face value per unit of SOM order size, and MinAmt in dollars.
face_per_unit = 1000000
min_amt = 0

# Local limits, checked before an order is sent; 0 = none.
max_order_face = 50000000
max_orders_per_sec = 50
