# Kraken post-trade fills client: the Kraken Futures demo environment
# (README.md). Not certified. Keys are not in this file: key_file names a JSON
# file outside the repository, {"api_key": "...", "api_secret": "..."}.
# (Boost's ini reader has no end-of-line comments.)

[kraken_fills]
# spot | futures
product = futures
# true: only demo-futures.kraken.com is accepted
testnet = true
rest_host = demo-futures.kraken.com
key_file = ~/.kaspar/keys/kraken_futures_demo.json
# GET /fills polling period (cost 2 per call)
poll_ms = 1000
# reconciliation: GET /fills paged with lastFillTime (cost 25 per page)
reconcile_every_s = 60
reconcile_lookback_s = 3600
reconnect_ms = 2000
sim = false
# SYMBOL|REST_PAIR|KASPAR_ASSET|LOT, comma separated; REST_PAIR empty for futures
instruments = PF_XBTUSD||KRAKENF_PFXBTUSD|0.0001
