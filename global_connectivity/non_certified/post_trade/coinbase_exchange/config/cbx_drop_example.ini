; CbxDropClient configuration (example). Credentials are read at run time
; from session.key_file (README.md, "Credentials"); the drop copy uses
; dc_key/dc_secret/dc_passphrase from that file when present, else key/
; secret/passphrase (Coinbase allows one FIX connection per API key).

[session]
; sandbox or production; a sandbox configuration refuses production hosts
environment = sandbox
; empty: fix-dc.sandbox.exchange.coinbase.com:6122
host =
port = 0
key_file = ~/.kaspar/keys/coinbase_exchange_sandbox.json
; HeartBtInt, at most 300 on the drop copy
heartbeat_s = 30
store_dir = /var/tmp/kaspar_cbx_drop
ca_file =
transport_dict = ~/kaspar-hft/global_connectivity/non_certified/order_entry/coinbase_exchange/fix/FIXT11-prod-sand.xml
app_dict = ~/kaspar-hft/global_connectivity/non_certified/order_entry/coinbase_exchange/fix/FIX50-prod-sand.xml
reconnect_ms = 5000

[products]
list = BTC-USD,ETH-USD

; asset: the Kaspar asset id; base_increment: TradeCapture.qty is in these
[BTC-USD]
asset = 1
base_increment = 0.00000001

[ETH-USD]
asset = 2
base_increment = 0.00000001
