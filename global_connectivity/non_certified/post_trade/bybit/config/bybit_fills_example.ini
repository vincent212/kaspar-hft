; BybitFillsClient settings (example). NOT CERTIFIED. Testnet only: with
; testnet = true the client refuses any host that is not a Bybit testnet or
; demo host.
[fills]
sim = false
testnet = true
rest_host = api-testnet.bybit.com
ws_host = stream-testnet.bybit.com
; {"api_key": "...", "api_secret": "..."}, outside the repository
key_file = ~/.kaspar/keys/bybit_testnet.json
; REST reconciliation: after every login, then every reconcile_every_s
reconcile_every_s = 300
margin_s = 60
reconnect_ms = 2000
sim_fill_every_ms = 0

[instruments]
; Kaspar asset id = <category> <symbol> <qty_unit>
1 = linear BTCUSDT 0.001
2 = spot BTCUSDT 0.000001
