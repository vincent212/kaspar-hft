#
# QuickFIX initiator config for Trading Technologies FIX order routing.
#
# Copy this file (e.g. to tt_uat.cfg, which git ignores) and replace every
# <...> value with the session details TT gives you for your FIX session.
# Run from a directory where FileLogPath and FileStorePath are writable.
#

[DEFAULT]

FileLogPath=log
FileStorePath=filestore
ConnectionType=initiator
ReconnectInterval=5
SocketNodelay=Y
StartTime=17:00:00
EndTime=17:00:00
UseLocalTime=Y
TimestampPrecision=9
HeartBtInt=30
BeginString=FIX.4.4
# Set to Y to print FIX messages and session events to stdout
ScreenLogShowIncoming=N
ScreenLogShowOutgoing=N
ScreenLogShowEvents=Y

SecurityExchange=CME

# --- session credentials, from TT ---
Password=<YOUR_PASSWORD>
# Account (tag 1)
Account=<YOUR_ACCOUNT>
# TargetCompID (tag 56)
TargetCompID=<TARGET_COMP_ID>
# SenderCompID (tag 49), set when TT created the FIX session
SenderCompID=<SENDER_COMP_ID>
# FIX user (tag 116, OnBehalfOfSubID). TT requires it when several users are
# mapped to the account. QuickFIX does not stamp it, so TTFixClient adds it to
# every outbound business message. Leave empty if TT does not require it.
OnBehalfOfSubID=<FIX_USER>

[SESSION]

# --- TLS through stunnel (see stunnel.conf): connect to the local stunnel port ---
SocketConnectHost=127.0.0.1
SocketConnectPort=<LOCAL_STUNNEL_PORT>

# --- or TLS in QuickFIX itself (QuickFIX built with OpenSSL, ttom built with
#     TTOM_SSL=y): connect to TT directly ---
#SocketConnectHost=<TT_FIX_HOST>
#SocketConnectPort=<TT_FIX_PORT>
#ClientCertificateFile=TTFIX.crt

# Message validation against TT's FIX 4.4 data dictionary (download from TT)
UseDataDictionary=Y
DataDictionary=TT-FIX44.xml

# Sequence number resets
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
