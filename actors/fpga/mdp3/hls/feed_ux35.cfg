# Vitis HLS config for the MDP3 handler: decoder, filter, batcher (MDP3_PLAN.md). Run from
# this directory with MDP3_PACKETS and MDP3_REF set (make hls in ../).
# The real part of the X3522PV.
part=xcux35-vsva1365-2-e

[hls]
syn.file=feed_top.cpp
syn.file_cflags=feed_top.cpp,-DKFPGA_HLS -DMDP3_CONTRACTS=42001080 -I.. -I../include -I../../include
syn.top=mdp3_feed_top
tb.file=tb_feed.cpp
tb.file_cflags=tb_feed.cpp,-DKFPGA_HLS -DMDP3_CONTRACTS=42001080 -I.. -I../include -I../../include
clock=4ns

# Vivado out-of-context place and route, for timing: vitis-run --mode hls --impl
vivado.flow=impl
