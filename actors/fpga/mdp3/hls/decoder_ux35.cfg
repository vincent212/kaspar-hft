# Vitis HLS config for the MDP3 decoder (phase 1 of MDP3_PLAN.md). Run from
# this directory with MDP3_PACKETS and MDP3_REF set (make hls in ../).
# The real part of the X3522PV, for timing; needs the Enterprise or Alveo license.
part=xcux35-vsva1365-2-e

[hls]
syn.file=decoder_top.cpp
syn.file_cflags=decoder_top.cpp,-DKFPGA_HLS -I.. -I../include -I../../include
syn.top=mdp3_decoder_top
tb.file=tb_decoder.cpp
tb.file_cflags=tb_decoder.cpp,-DKFPGA_HLS -I.. -I../include -I../../include
clock=4ns

# Vivado out-of-context place and route, for timing: vitis-run --mode hls --impl
vivado.flow=impl
