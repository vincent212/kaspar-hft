# Vitis HLS config for the MDP3 decoder (phase 1 of MDP3_PLAN.md). Run from
# this directory with MDP3_PACKETS and MDP3_REF set (make hls in ../).
# The KU5P is a stand-in for the X3522PV that the free Vivado Basic tier covers.
part=xcku5p-ffvb676-2-e

[hls]
syn.file=decoder_top.cpp
syn.file_cflags=decoder_top.cpp,-I.. -I../include -I../../include
syn.top=mdp3_decoder_top
tb.file=tb_decoder.cpp
tb.file_cflags=tb_decoder.cpp,-I.. -I../include -I../../include
clock=4ns
