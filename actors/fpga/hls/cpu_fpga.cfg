# Vitis HLS config for the cpu_fpga design. Run from this directory (make hls).
# The KU5P is a stand-in for the X3522PV that the free Vivado Basic tier covers.
part=xcku5p-ffvb676-2-e

[hls]
syn.file=cpu_fpga_top.cpp
syn.file_cflags=cpu_fpga_top.cpp,-DKFPGA_HLS -I../include -I../examples/ping_pong -I../examples/cpu_fpga
syn.top=cpu_fpga_top
tb.file=tb_cpu_fpga.cpp
tb.file_cflags=tb_cpu_fpga.cpp,-DKFPGA_HLS -I../include -I../examples/ping_pong -I../examples/cpu_fpga
clock=4ns
