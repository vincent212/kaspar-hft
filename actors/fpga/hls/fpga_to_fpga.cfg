# Vitis HLS config for the fpga_to_fpga design. Run from this directory (make hls).
# The KU5P is a stand-in for the X3522PV that the free Vivado Basic tier covers.
part=xcku5p-ffvb676-2-e

[hls]
syn.file=fpga_to_fpga_top.cpp
syn.file_cflags=fpga_to_fpga_top.cpp,-DKFPGA_HLS -I../include -I../examples/ping_pong
syn.top=fpga_to_fpga_top
tb.file=tb_fpga_to_fpga.cpp
tb.file_cflags=tb_fpga_to_fpga.cpp,-DKFPGA_HLS -I../include -I../examples/ping_pong
clock=4ns
