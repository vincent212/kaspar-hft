# Vitis HLS config for the group design. Run from this directory (make hls).
# The KU5P is a stand-in for the X3522PV that the free Vivado Basic tier covers.
part=xcku5p-ffvb676-2-e

[hls]
syn.file=group_top.cpp
syn.file_cflags=group_top.cpp,-DKFPGA_HLS -I../include -I../examples/ping_pong
syn.top=group_top
tb.file=tb_group.cpp
tb.file_cflags=tb_group.cpp,-DKFPGA_HLS -I../include -I../examples/ping_pong
clock=4ns
