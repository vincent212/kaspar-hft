; Kaspr Trading System Configuration

kaspr {
    general {
        universe config/universe.csv              ; Universe file with product definitions
        mqport 7777                               ; MQ0 server port for ZMQ monitoring
        tachbook true                             ; Enable TachBook (MBO L3) parallel to OB - set true to activate
    }

    ; Per-channel enable/disable flags
    ; Source: CME Globex Product Reference spreadsheet
    channels {
        chan_310 true       ; ES futures (Channel 310 - CME Globex E-mini S&P 500)
        chan_318 true       ; NQ futures (Channel 318 - CME Globex E-mini NASDAQ-100)
        chan_344 false      ; Treasury futures (Channel 344 - CBOT Interest Rate Futures)
    }

    risk {
        limit 100000    ; Risk limit for RM
    }

    ; MySQL database configuration for DB actor
    mysql {
        host localhost
        user etrading
        password CHANGEME
        database kasprowy_paper_trading_db
    }
}
