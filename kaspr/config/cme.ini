; CME MDP3 Market Data Configuration

cme {
    ; Equity futures (ES, NKD) - Channel 310
    prod_equity {
        cme_ini "genconfig/mdp3_prod.info"
        chan 310
        cme_do_recovery true
        cme_disable_mbo false
        cme_max_mbp_level 0
    }

    ; Nasdaq/NQ futures (NQ, Nikkei) - Channel 318
    prod_nasdaq {
        cme_ini "genconfig/mdp3_prod.info"
        chan 318
        cme_do_recovery true
        cme_disable_mbo false
        cme_max_mbp_level 0
    }

    ; Treasury futures - Channel 344 "CBOT Globex Interest Rate Futures"
    prod_treasury_futures {
        cme_ini "genconfig/mdp3_prod.info"
        chan 344
        cme_do_recovery true
        cme_disable_mbo false
        cme_max_mbp_level 0
    }

    ; Certification environment - Equity
    cert_equity {
        cme_ini "genconfig/mdp3_cert.info"
        chan 310
        cme_do_recovery true
        cme_disable_mbo false
        cme_max_mbp_level 0
    }
}
