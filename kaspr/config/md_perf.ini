; md_perf.ini -- wire-to-book latency measurement run.
;
; This is kaspr.ini with the probe turned on and the ports moved. It is NOT
; the production recorder config: do not point run_local.sh at it.
;
; mqport differs from kaspr.ini (7777) so this can, in principle, run beside
; the live recorder without a bind collision. That does NOT make running
; beside it safe -- see run_probe.sh on the multicast fan-out question. Solo
; is the supported mode.

kaspr {
    general {
        universe config/universe.csv
        mqport 7778                               ; NOT 7777 -- avoid the live recorder

        tachbook true                             ; REQUIRED: the probe subscribes to TachBook

        ; --- latency probe -----------------------------------------------
        perf_probe true

        ; Accumulation grid. MUST equal QLen's period_ms if the CSV is going
        ; to be joined against queue depth -- the join key is
        ; floor(observed_ns / bin_ms) and a mismatch is silently wrong, not
        ; an error.
        perf_bin_ms 100

        ; Empty => console only (`mdperf`). Set => one CSV per instrument.
        perf_csv_dir /home/vincent/perf/mdperf
    }

    channels {
        chan_310 true       ; ES futures
        chan_318 true       ; NQ futures
        chan_344 false      ; Treasuries -- start_market_data() has no branch for it
    }

    risk {
        limit 100000
    }

    mysql {
        host localhost
        user etrading
        password CHANGEME
        database kasprowy_paper_trading_db
    }
}
