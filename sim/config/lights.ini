; SIM-SIZED ARM. The production-shaped arm is sim/config_prod/lights.ini;
; the two differ ONLY in the four sizing lines below.
;
;   lights per side 4, nlevels 3, lev_orders_max 5, ord_sz 5
;   -> max working size 4 x 5 = 20 contracts per side
;
; in_cushion / out_cushion / reset_cushion used to be set here. They are read
; by no code anywhere in the tree -- leftovers from m2_kspr -- so they are gone
; rather than sitting here looking load-bearing.
nlevels 3
lev_orders_max 5
ord_sz 5
nlights_per_side 4

; --- shadow experiment knobs -------------------------------------------
; Placement rate in BASIS POINTS of EOB ADD messages acted on.
; 50 = 0.5%, 100 = 1%, 300 = 3%, 500 = 5%.
place_rate_bp 300
; Delay from the shadowed order being hit/pulled to our own cancel going out.
; Two mutually exclusive units; set at most one, 0 on both = cancel immediately
; (the normal case, and what the code did in practice before this knob existed).
;   delayed_cancel_events  counts EOB messages (MDP3 incremental cycles). This is
;                          the preferred unit: the risk after the attached order
;                          leaves is carried by flow, not by wall-clock.
;   delayed_cancel_ms      fixed wall-clock, kept so the two can be compared.
delayed_cancel_events 0
delayed_cancel_ms 0
; AGGRESSIVE participation, in BASIS POINTS of trades shadowed. 0 = off, and
; off is the pure shadow algorithm -- a config that omits this behaves exactly
; as it did before the knob existed.
;
; Same mechanism as place_rate_bp, different trigger and different price.
; place_rate_bp flips a coin on each ADD and, when it wins, rests a limit order
; on our own side. This flips a coin on each TRADE and, when it wins, places a
; limit order at the price that trade printed at -- the far side for us, so it
; executes instead of resting. Both go through place_if_can_impl, so the size
; cap, the max_dist test and the position throttle apply identically.
;
; This is the BANK TOTAL, not a per-light rate: the light divides it by
; nlights_per_side, so 200 means 2% of trades on any arm, whether the bank has
; 4 lights or 12. (place_rate_bp is per light, deliberately -- it is a placement
; rate whose realised participation is an outcome either way, whereas this is a
; target, and a target that changed meaning with the light count would be a
; trap.)
aggr_participation_bp 0

; Deterministic seed for placement; mixed with each light's name.
rng_seed 1
