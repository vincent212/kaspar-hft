; SIM-SIZED ARM. The production-shaped arm is sim/config_prod/lights.ini;
; the two differ ONLY in the four sizing lines below.
;
;   lights per side 4, nlevels 3, lev_orders_max 5, ord_sz 5
;   -> max working size 4 x 5 = 20 contracts per side
;
; in_cushion / out_cushion / reset_cushion used to be set here. They are read
; by no code anywhere in the tree -- leftovers from m2_kspr -- so they are gone
; rather than sitting here looking load-bearing.
nlevels 3
lev_orders_max 5
ord_sz 5
nlights_per_side 4

; --- shadow experiment knobs -------------------------------------------
; Placement rate in BASIS POINTS of EOB ADD messages acted on.
; 50 = 0.5%, 100 = 1%, 300 = 3%, 500 = 5%.
place_rate_bp 300
; Delay from the shadowed order being hit/pulled to our own cancel going out.
; Two mutually exclusive units; set at most one, 0 on both = cancel immediately
; (the normal case, and what the code did in practice before this knob existed).
;   delayed_cancel_events  counts EOB messages (MDP3 incremental cycles). This is
;                          the preferred unit: the risk after the attached order
;                          leaves is carried by flow, not by wall-clock.
;   delayed_cancel_ms      fixed wall-clock, kept so the two can be compared.
delayed_cancel_events 0
delayed_cancel_ms 0
; Deterministic seed for placement; mixed with each light's name.
rng_seed 1
