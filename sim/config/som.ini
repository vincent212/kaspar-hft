; A NEGATIVE limit disables the check entirely (SOM.cpp). Zero does NOT -- zero
; is a real limit of zero and rejects every order.
;
; ES is -1 here because the probe quotes BOTH sides at +/-sz simultaneously: the
; moment one side fills, a position limit would reject the other side's orders
; and the measurement would be one-sided.
som
{
    pos_limit
    {
        ES -1
        NQ 1000
        ZN 1000
        ZF 1000
        ZB 1000
        UB 1000
    }

    size_limit
    {
        ES -1
        NQ 100
        ZN 100
        ZF 100
        ZB 100
        UB 100
    }
}
