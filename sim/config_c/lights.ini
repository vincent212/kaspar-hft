; ARM C -- config_a with the light count doubled, and nothing else changed that
; the code actually reads.
;
;                     config_a   config_c   binds?
;   nlights_per_side  6          12         YES -- prices we can rest at at once
;   ord_sz            3          3          same
;   lev_orders_max    5          5          same
;   nlevels           5          10         NO  -- see below
;
; This is the clean light-count isolation. config_b changed four things at once
; (12 lights AND ord_sz 5 AND lev_orders_max 10 AND nlevels 10), so a-vs-b
; cannot say which one moved the result. a-vs-c differs in exactly one thing
; the code consumes.
;
; On nlevels specifically: raising it 5 -> 10 changes NOTHING observable. It is
; read in exactly one place, to size all_orders_max:
;
;     all_orders_max = max(lev_orders_max * (nlevels + 3), (max_dist+1) * lev_orders_max)
;
; and that ceiling is tested as `qcoord->total_sz() + ord_sz > all_orders_max`.
; Each light owns its QCoord and holds exactly ONE order (ord_info_t is a single
; slot), so total_sz() is 0 whenever a light is about to place: 0 + 3 > 40 is
; never true, and 0 + 3 > 65 is never true either. nlevels is carried here
; because it was asked for, and so that the file states plainly that it is inert
; rather than leaving someone to assume it did the work.
;
; What actually decides how deep we rest is max_dist (ticks from the touch),
; which gates placement directly: `if (bestpx < best_bid - max_dist) return`.
; It is not set here, so both arms use the code default of 4.
nlevels 10
lev_orders_max 5
ord_sz 3
nlights_per_side 12

; --- shadow experiment knobs (identical to config_a) -------------------
place_rate_bp 300
delayed_cancel_events 5
delayed_cancel_ms 0
rng_seed 1
