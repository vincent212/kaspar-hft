; ZN (10-year Treasury) shadow settings, tuned 2026-10-24 on the two October 2026
; recordings (ZNZ6, 100-lot probe legs, both weeks). With these:
;   participation 2.16% aggregate / 2.81% median per window
;   100-lot leg fills in 63 s median, 291 s p90
;   slip_paired +0.063 +- 0.028 ticks, 13% of orders fill
; Runs: ~/recdata/344/runs/grid_wm4_nohalf_sz100/nl64_lev100/
;
; What moved participation, in order of effect (config_a: 0.01%):
;   max_dist 10 -> 2       ZN queues are deep; resting 10 ticks back rarely fills
;   work_multiple 4        the side may work 4x what is left to fill (light22.hpp)
;   nlights_per_side 64    more lights hold more orders; 128+ adds nothing
;   lev_orders_max 100     with enough lights, more size per price helps
; Placement rate (5%-50%) and delayed_cancel_events (5-50) barely matter here.
;
; Run with --probe-size 100; see sim/README.md.

nlevels 5
lev_orders_max 100
ord_sz 10
nlights_per_side 64
place_rate_bp 2500
delayed_cancel_events 50
delayed_cancel_ms 0
rng_seed 1
max_dist 2
max_dist_cancel 3
work_multiple 4
