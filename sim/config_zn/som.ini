; A NEGATIVE limit disables the check entirely (SOM.cpp). Zero does NOT -- zero
; is a real limit of zero and rejects every order.
;
; Same limits as config_a. For ZN they are 1000 (position) and 100 (order
; size): far above the 100-lot probe legs and the ~120-lot peak position seen
; with config_zn's lights.ini. A probe run much larger than --probe-size 100
; should raise ZN's pos_limit, or set it to -1 (no check), so SOM rejections
; do not cap the measurement silently.
som
{
    pos_limit
    {
        ES -1
        NQ 1000
        ZN 1000
        ZF 1000
        ZB 1000
        UB 1000
    }

    size_limit
    {
        ES -1
        NQ 100
        ZN 100
        ZF 100
        ZB 100
        UB 100
    }
}
