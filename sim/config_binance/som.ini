; A negative limit disables the check (SOM.cpp): the probe quotes both sides
; at once, and a position limit would reject one side the moment the other
; fills. Limits are matched on the asset-name prefix.
som
{
    pos_limit
    {
        BTCUSDT -1
        ETHUSDT -1
        BTC-USD -1
        ETH-USD -1
        BTC -1
        ETH -1
    }

    size_limit
    {
        BTCUSDT -1
        ETHUSDT -1
        BTC-USD -1
        ETH-USD -1
        BTC -1
        ETH -1
    }
}
