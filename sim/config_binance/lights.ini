; The shadow lights on a Binance book. Sizes are in chunks (binance.ini).
; Each chunk is one synthetic order, so a light shadows a chunk and places
; one chunk: ord_sz 1.
nlevels 5
lev_orders_max 10
ord_sz 1
nlights_per_side 10

; Placement rate in basis points of EOB ADD messages acted on, per light.
place_rate_bp 300
delayed_cancel_events 5
delayed_cancel_ms 0
rng_seed 1

; Ticks from the inside.
max_dist 10
max_dist_cancel 12
