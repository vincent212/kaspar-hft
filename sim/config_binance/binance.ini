; One section per symbol. Tick and step sizes are Binance's (exchangeInfo,
; 2026-11-16). `chunk` is the size of one synthetic order: every level is cut
; into ceil(qty / chunk) of them, so sizes in OB, the lights and the probe are
; in chunks. `ladder` is OB's ring of price slots per side (a power of two):
; it must cover far more than the depth the lights rest at.
;
;   BTCUSDT spot   tick 0.01  ladder 524288 = 5,242 USD per side
;   BTCUSDT perp   tick 0.10  ladder  65536 = 6,553 USD
;   ETHUSDT        tick 0.01  ladder 131072 = 1,310 USD
;
; sec_id is any number unique within the process; OB matches records on it.

BTCUSDT
{
    tick          0.01
    chunk         0.01
    futures_tick  0.1
    futures_chunk 0.1
    ladder        524288
    sec_id        1
}

ETHUSDT
{
    tick          0.01
    chunk         0.1
    futures_tick  0.01
    futures_chunk 1
    ladder        131072
    sec_id        2
}
