; Coinbase spot (Advanced Trade), one section per product. Tick and size
; increments are Coinbase's (api/v3/brokerage/market/products, 2026-11-17):
; price 0.01, base 0.00000001. `chunk` is the size of one synthetic order;
; sizes in OB, the lights and the probe are in chunks. `depth` is how many
; levels per side of Coinbase's full book go into the synthetic book; `ladder`
; is OB's ring of price slots per side (a power of two), and must cover them.
;
;   BTC-USD  tick 0.01  ladder 524288 = 5,242 USD per side
;   ETH-USD  tick 0.01  ladder 131072 = 1,310 USD
;
; sec_id is any number unique within the process; OB matches records on it.

BTC-USD
{
    tick    0.01
    chunk   0.01
    depth   1000
    ladder  524288
    sec_id  1
}

ETH-USD
{
    tick    0.01
    chunk   0.1
    depth   1000
    ladder  131072
    sec_id  2
}
