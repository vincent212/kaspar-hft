; Hyperliquid perpetuals, one section per coin. Hyperliquid prices carry at
; most five significant figures, so the tick depends on the price: BTC above
; 10,000 trades in whole dollars, ETH between 1,000 and 10,000 in 0.1. If the
; price crosses a power of ten the tick changes and this file must follow.
; The l2Book feed is the best 20 levels per side, so `ladder` only has to
; cover a little more than 20 ticks; 4096 leaves room for the price to move.
;
; `chunk` is the size of one synthetic order; sizes in OB, the lights and the
; probe are in chunks. sec_id is any number unique within the process.

BTC
{
    tick    1
    chunk   0.01
    ladder  4096
    sec_id  1
}

ETH
{
    tick    0.1
    chunk   0.1
    ladder  4096
    sec_id  2
}
