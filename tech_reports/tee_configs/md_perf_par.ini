; md_perf.ini -- wire-to-book latency measurement run.
;
; This is kaspr.ini with the probe turned on and the ports moved. It is NOT
; the production recorder config: do not point run_local.sh at it.
;
; mqport differs from kaspr.ini (7777) so this can, in principle, run beside
; the live recorder without a bind collision. That does NOT make running
; beside it safe -- see run_probe.sh on the multicast fan-out question. Solo
; is the supported mode.

kaspr {
    general {
        ; The LIVE universe, not the checked-in one. config/universe.csv in this
        ; repo is stale -- it lists M6/U6 only, so on any date past the
        ; September roll the probe would build books for an expired contract
        ; and measure nothing. The live file is rolled weekly and carries Z6.
        ; A measurement of the wrong contract is worse than no measurement:
        ; it looks like a result.
        universe /home/vincent/m2_kspr/kaspr/config/universe.csv
        mqport 7778                               ; NOT 7777 -- avoid the live recorder

        tachbook true                             ; REQUIRED: the probe subscribes to TachBook

        ; --- latency probe -----------------------------------------------
        perf_probe true

        ; Accumulation grid: 10 Hz, 100 ms bins.
        ;
        ; This used to read "MUST equal QLen's period_ms". That constraint is
        ; dead and was never live in this config: QLen is not created in
        ; kaspr.cpp at all, and queue depth now arrives per-record as
        ; ingress_qlen on the payload rather than as a separately sampled
        ; series needing a join key. There is nothing left to align to.
        ;
        ; Was briefly 10 ms. Reverted 2026-09-16: 100 Hz left most bins on the
        ; slower instruments holding one message or none, so a per-bin mean was
        ; one draw and the table was noise. 100 ms is the version that worked.
        ;
        ; Bin size was never the right tool for sub-bin structure anyway, and
        ; no bin size is. That is what the ia_* interarrival moments and the
        ; .arr raw arrival log are for: both measure packet to packet directly
        ; and are indifferent to this setting.
        perf_bin_ms 100

        ; Empty => console only (`mdperf`). Set => one CSV per instrument.
        perf_csv_dir /home/vincent/perf/mdperf_par

        ; Route the feed into TachBook instead of OB. Without this the
        ; TachBooks are built and started but never receive a single message,
        ; because handler_if carries one book vector and it points at OB.
        ; Destructive: the OBs go dark, so lights/SOM/DB/MTD see a dead
        ; market for the length of the run. Correct for a latency window,
        ; wrong for anything else. Must stay out of kaspr.ini.
        perf_route_tachbook true

        ; --- CPU pinning -------------------------------------------------
        ; TachBook threads, round-robin in creation order over these cpus.
        ; Six books exist (ESM6 ESZ6 NQM6 NQZ6 ZNM6 ZNZ6) so each cpu takes
        ; two, one live and one dead:
        ;   19 <- ESM6(idle), NQZ6      23 <- ESZ6, ZNM6(idle)
        ;   55 <- NQM6(idle), ZNZ6
        ; ESZ6 is the busiest book and gets cpu23 effectively to itself.
        ;
        ; cpu19 is not perfectly idle -- it measured 5.5% busy over 12 s while
        ; the rest of node 2 was under 1% -- and NQZ6 lands there. If NQ shows
        ; a tail that ES and ZN do not, that is the first thing to move.
        ; UNPINNED 2026-09-16
        ; tachbook_cpus 19,23,55
    }

    channels {
        chan_310 true       ; ES futures
        chan_318 true       ; NQ futures
        ; chan_344 (ZN/ZF/ZB/ZT/UB) -- CME interest rates.
        ;
        ; RETRACTION, 2026-09-16. This comment previously asserted the channel
        ; was held by onload stacks owned by uid 0, and concluded ZN was
        ; "unmeasurable from this uid while root holds the channel". Both
        ; halves were wrong. Evidence:
        ;   onload_stackdump lots      -> every stack and every socket reports
        ;                                 uid=1010. There is no uid=0 anywhere.
        ;   ss -una | grep 1[45]344    -> no match. udp/14344 and udp/15344 are
        ;                                 NOT BOUND, by anyone.
        ; The ports that ARE bound (14310/14318/15310/15318) belong to pid
        ; 2050051 = md_perf_meter, our own earlier probe run. So the original
        ; EADDRINUSE was a probe colliding with a probe -- self-inflicted, and
        ; the privilege story was invented to explain it.
        ;
        ; Kill any stale md_perf_meter before starting a run.
        chan_344 true
    }

    risk {
        limit 100000
    }

    mysql {
        host localhost
        user etrading
        password CHANGEME
        database kasprowy_paper_trading_db
    }
}
