# Build kaspar-hft on a clean Ubuntu runner: generate the CME SBE codecs, build
# the libraries and the kaspr binary, then run the unit tests.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 libboost-all-dev libgsl-dev libzmq3-dev cppzmq-dev \
            nlohmann-json3-dev libcrypto++-dev libpcap-dev zlib1g-dev \
            libgtest-dev python3-paramiko default-jre-headless

      - name: Cache SBE tool jar
        uses: actions/cache@v4
        with:
          path: genschema/.cache
          key: sbe-all-1.30.0

      - name: Generate CME SBE codecs
        run: ./build.sh schema

      - name: Build libraries
        run: ./build.sh

      - name: Build kaspr
        run: ./build.sh -C kaspr/src

      - name: Unit tests
        run: ./build.sh test
